
<html>

  <head>
    <title>PlanetaryXR</title>
    <meta charset="utf-8">
    <meta name="description" content="PlanetaryXR">
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, maximum-scale=1.0, initial-scale=1.0, user-scalable=no, minimal-ui">
    <!-- SCRIPTS -->
    <script src="./js/analytics.js"></script>
    <script src="https://aframe.io/releases/0.5.0/aframe.min.js"></script>
    <script src="./js/aframe-ar.js"></script>
    <script>THREEx.ArToolkitContext.baseURL = 'https://rawgit.com/jeromeetienne/ar.js/master/three.js/'</script>
    <!-- STYLING -->
    <link href="https://fonts.googleapis.com/css?family=Ubuntu:300,300i,500" rel="stylesheet">
    <link href="./css/app.css" rel="stylesheet" type="text/css">
  </head>

<body style='margin : 0px; overflow: hidden;'>
<a-scene embedded artoolkit="sourceType: webcam;">

    <a-assets>
        
       <img id="txEarth" src="./assets/textures/earth.jpg">
        
    </a-assets>

    <a-marker preset='custom' url='pattern.patt'>
        <a-box position='0 0.5 0' material='color: green;opacity: 0.5'></a-box>
    </a-marker>

 

        <a-marker
          type="pattern"
          url="./assets/markers/earth.pat">
          <a-entity
            id="current-planet-container"
            rotation="270 0 -23.4">
            <a-sphere
              id="current-planet"
              src="#txEarth"
              position="0 0 0"
              radius="1"
              scale="0.5 0.5 0.5">
            </a-sphere>
          </a-entity>
        </a-marker>

    <a-entity camera></a-entity>

</a-scene>
</body>

</html>
